packages:
  - "apps/*"
  - "packages/*"
  - "fixtures"

# Refuse versions published less than a day ago: compromised releases are usually pulled within hours.
minimumReleaseAge: 1440
# Some registry metadata lacks per-version publish times, which the age check needs to pick a
# lowest version; resolving to the highest version that passes the age check avoids that.
resolutionMode: highest

# No dependency may run an install script unless it is listed here with a reason.
# The store uses Node's built-in node:sqlite, so nothing native is needed today.
allowBuilds:
  # Pulled in by the message extractor of next-intl, which Finora does not use; both ship prebuilt binaries.
  "@parcel/watcher": false
  "@swc/core": false

