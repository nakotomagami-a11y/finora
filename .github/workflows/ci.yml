name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Dependency table, tokens, lawyer register, generated items
        run: pnpm check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  build:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: finora-sentinel-anthropic-api-key
      SEC_USER_AGENT: finora-sentinel-sec-user-agent
      SOCRATA_APP_TOKEN: finora-sentinel-socrata-app-token
      COURTLISTENER_TOKEN: finora-sentinel-courtlistener-token
      CERTSPOTTER_API_KEY: finora-sentinel-certspotter-api-key
      SAM_GOV_API_KEY: finora-sentinel-sam-gov-api-key
      NEXT_PUBLIC_ANTHROPIC_API_KEY: finora-sentinel-anthropic-api-key
      NEXT_PUBLIC_SEC_USER_AGENT: finora-sentinel-sec-user-agent
      NEXT_PUBLIC_SOCRATA_APP_TOKEN: finora-sentinel-socrata-app-token
      NEXT_PUBLIC_COURTLISTENER_TOKEN: finora-sentinel-courtlistener-token
      NEXT_PUBLIC_CERTSPOTTER_API_KEY: finora-sentinel-certspotter-api-key
      NEXT_PUBLIC_SAM_GOV_API_KEY: finora-sentinel-sam-gov-api-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: No secret in the client bundle
        run: node scripts/check-bundle-secrets.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @finora/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  visual:
    # Screenshot comparison runs in the pinned Playwright image (fonts differ by system). The baselines are
    # committed in apps/web/e2e/__screenshots__ and each one is recorded with `guard review`. An empty or missing
    # directory fails the job: a lost baseline set must not pass. To change a baseline on purpose, run the job
    # with the new design, download the `visual-actual` artifact, open each image, `guard review` it and commit it.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Baselines are committed
        run: |
          count=$(find apps/web/e2e/__screenshots__ -name '*.png' 2>/dev/null | wc -l)
          echo "baselines: $count"
          test "$count" -gt 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @finora/web e2e:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: visual-actual
          path: apps/web/test-results
          retention-days: 7
