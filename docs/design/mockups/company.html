<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Company · Finora mockup</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
<script src="assets/fixtures.js"></script>
</head>
<body>
<script>
(function () {
  "use strict";
  const { esc, param, icon, chip, conf, aiTag, ruleTag, agentTag, sev, fieldRow, notChecked, section, sparkline, sheet } = Finora;
  const { S } = FX;

  const countryKey = param("country", "lv");
  const subj = FX.SUBJECTS[countryKey] || FX.LV;
  const rawState = param("state", "full");
  // Agents never run on a natural person or sole trader (architecture §7, R5, P6): only profile states exist.
  const state = subj.natural && !["full", "loading", "error"].includes(rawState) ? "full" : rawState;
  const q = param("q", "entity");
  const purposeSet = param("purpose", "set") === "set";
  const newInstall = param("install", "established") === "new";
  const secMissing = subj.key === "us-public" && param("sec", "set") === "missing";
  const longName = param("name", "normal") === "long" && subj.longName;
  const lvRoleCounts = subj.key === "lv" && param("lvpeople", "names") === "role_counts";
  const reconnecting = state === "reconnecting";
  const stopped = state === "report" && param("stopped", "no") === "yes";
  const limited = state === "limit";
  const overage = state === "overage";
  const overageEnabled = param("overage", "off") === "enabled";
  const concurrency2 = param("concurrency", "4") === "2";
  const phase = ["streaming", "question", "reconnecting", "limit", "overage"].includes(state) ? "run" : ["report", "partial"].includes(state) ? "report" : "profile";
  const natural = !!subj.natural;
  const name = longName ? subj.longName : subj.name;

  const defaultLevel = { lv: "points", ee: "points", lt: "points", "us-private": "insufficient", "us-public": "none" }[subj.key];
  const offer = param("offer", "none");
  const level = param("verdict", "auto") === "auto" ? defaultLevel : param("verdict");
  if (newInstall && subj.checks) subj.checks = subj.checks.map((c, i) => (i === 1 && c[1] !== "notrun" ? [c[0], "noteval", "Active · rename rule not evaluated: tracked since 16 Nov 2026"] : c));
  if (lvRoleCounts) {
    subj.checks = subj.checks.map((c, i) => (i === 2 ? [c[0], "ok", "2 board members on record (names pending a legal review)"] : i === 8 ? [c[0], "ok", "Company screened, 5 lists; officers not screened: names not loaded"] : c));
    subj.coverage = { ...subj.coverage, notOpen: subj.coverage.notOpen + ", officer names (pending a legal review)" };
  }

  /* ---------- Header ---------- */
  function header() {
    if (state === "loading") {
      return `<div class="co-head" aria-busy="true"><h1 class="sr-only">Loading the company</h1><span class="sk" style="width:120px;height:10px"></span><span class="sk" style="width:62%;height:36px;border-radius:8px"></span><span class="sk" style="width:48%"></span><span class="sk" style="width:100%;height:56px;border-radius:10px"></span></div>`;
    }
    const pillTone = { good: "", warn: "pill-warn", bad: "pill-bad" }[subj.status[2]] || "";
    const runStats = phase === "run"
      ? `<div class="run-head" aria-live="polite">
           <span class="run-stats num">${icon("agent", "icon icon-sm")} ${reconnecting ? "Reconnecting · last update 09:43:12" : limited ? "Paused: your Claude plan's usage limit · resumes after 14:00" : overage ? "Paused: paid extra usage is in use in your Claude account" : "Investigating"} · 4 agents · 23 tasks · 31 sources · 18% of the cap</span>
           ${overageEnabled ? `<span class="caveat" style="color:var(--ink-2)">${icon("warn", "icon icon-sm")}<span>Paid extra usage is on in your Claude account; Finora will stop before using it.</span></span>` : ""}
           <div class="meter" role="progressbar" aria-label="Investigation progress" aria-valuenow="58" aria-valuemin="0" aria-valuemax="100"><i style="width:58%"></i></div>
         </div>`
      : "";
    const actions = phase === "profile"
      ? `${natural ? "" : `<a class="btn btn-primary" href="?${qs({ state: "estimate" })}">${icon("play", "icon icon-sm")} Investigate</a>`}
         ${natural ? "" : `<a class="btn" href="network.html?country=${subj.key}">${icon("network", "icon icon-sm")} Network</a>`}
         <button class="link-btn" type="button" data-problem="${esc(name)}">Report a problem</button>`
      : phase === "run"
        ? `<a class="btn" href="?${qs({ state: "report", stopped: "yes" })}">${icon("stop", "icon icon-sm")} Stop and write the report</a><a class="btn btn-quiet" href="?${qs({ state: "report" })}">Skip to report</a>`
        : `<a class="btn" href="network.html?country=${subj.key}">${icon("network", "icon icon-sm")} Network</a>
           <button class="btn" type="button">Re-run</button>
           <button class="link-btn" type="button" data-problem="${esc(name)}">Report a problem</button>`;
    return `<div class="co-head">
      <span class="label">${phase === "report" ? "Investigation report · 20 Nov 2026 09:46" : phase === "run" ? "Investigation running" : `Company · ${esc(subj.country)}`}</span>
      <h1 class="co-title" title="${esc(name)}">${esc(name)}</h1>
      <div class="co-meta">
        <span class="pill ${pillTone}"><span class="dot"></span>${esc(subj.status[0])}${subj.status[1] ? `<span class="gloss">· ${esc(subj.status[1])}</span>` : ""}</span>
        <span>${esc(subj.form[0])} · ${esc(subj.form[1])}</span><span class="sep">/</span>
        <span class="num">${esc(subj.codeLabel)} ${esc(subj.code)}</span><span class="sep">/</span>
        <span>${esc(subj.address)}</span>
      </div>
      ${runStats}
      <div class="co-actions">${actions}</div>
      ${natural ? `<div class="disclaimer" role="note">${icon("info")}<span><strong>Not a credit report.</strong> Not for credit, employment, tenancy or insurance decisions. This is a sole trader, so Finora shows the official facts only: no verdict, no scored checks and no agent investigation.</span></div>` : ""}
      <div class="coverage" role="note" aria-label="What this country's official data covers">
        <span><strong>${esc(subj.country === "the United States" ? "The United States'" : subj.country + "'s")} official data:</strong> ${esc(subj.coverage.official)}.</span>
        <span><strong>Not in open data:</strong> ${esc(subj.coverage.notOpen)}.</span>
      </div>
    </div>`;
  }
  function qs(over) {
    const u = new URLSearchParams(location.search);
    Object.entries(over).forEach(([k, v]) => u.set(k, v));
    return u.toString();
  }

  /* ---------- Agent findings (inside sections) ---------- */
  function finding({ text, sev: s, conf: c, src, agent, landing }) {
    return `<div class="finding ${landing ? "landing" : ""}">
      <div class="finding-head">${agentTag(agent)}${sev(s)}<span class="muted small">${aiTag()}</span></div>
      <p>${esc(text)}</p>
      <div class="finding-meta">${conf(c)}${chip(src)}</div>
    </div>`;
  }
  const running = (agent, step) => `<div class="state-line" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>The ${esc(agent)} agent is checking this now: <span class="mono">${esc(step)}</span></span></div>`;

  /* ---------- Sections per subject ---------- */
  const R = (label, r) => fieldRow(label, r);
  function purposeGate() {
    return `<form class="gate" onsubmit="event.preventDefault();location.search='${qs({ purpose: "set" })}'">
      <fieldset><legend>Why are you looking at the people in this company?</legend>
        <label class="radio"><input type="radio" name="p" checked> <span>Checking a company I may do business with</span></label>
        <label class="radio"><input type="radio" name="p"> <span>Checking a company that contacted me or sent an invoice</span></label>
        <label class="radio"><input type="radio" name="p"> <span>Compliance check: sanctions or anti-money-laundering</span></label>
        <label class="radio"><input type="radio" name="p"> <span>Research or journalism</span></label>
      </fieldset>
      <span class="small muted">Asked once and kept for 12 hours. Each company you open is logged with this purpose. Not available for credit, employment, tenancy or insurance decisions about a person.</span>
      <span><button class="btn btn-primary btn-sm" type="submit">Show people</button></span>
    </form>`;
  }
  const personDisclaimer = () => `<div class="purpose-line">${icon("info", "icon icon-sm")}<span>Not a credit report. Not for credit, employment, tenancy or insurance decisions.</span></div>`;
  const purposeLine = () => `<div class="purpose-line">${icon("info", "icon icon-sm")}<span>Purpose: checking a company I may do business with · <a href="?${qs({ purpose: "unset" })}">change</a></span></div>`;

  function peopleSection() {
    let body;
    if (state === "loading") body = `<div class="rows">${R("Board", { state: "loading", w: 50 })}${R("", { state: "loading", w: 40 })}</div>`;
    else if (!purposeSet) body = `<div class="rows">${R("Officers", { state: "not_checked", reason: "needs_purpose" })}</div>${purposeGate()}`;
    else if (lvRoleCounts) body = `${purposeLine()}<div class="rows">
      ${R("Board", { state: "data", value: "2 board members: chair since 12 Mar 2014, member since 1 Feb 2021", src: S.urOfficers, conf: "official" })}
      ${R("Names", { state: "not_checked", reason: "restricted", text: "Officer names: pending a legal review" })}
      </div><span class="caveat">${icon("info", "icon icon-sm")}<span>Role counts and start dates only while a lawyer reviews whether Latvian officer data stays public. Officers are not screened against sanctions lists: names not loaded.</span></span>`;
    else if (subj.key === "lv") body = `${purposeLine()}
      <div class="tbl-scroll"><table class="tbl"><thead><tr><th>Role</th><th>Name</th><th>Since</th><th class="r">Source</th></tr></thead><tbody>
        <tr><td>Board member (chair)</td><td>Jānis Paraugs</td><td class="num">12 Mar 2014</td><td class="r">${chip(S.urOfficers)}</td></tr>
        <tr><td>Board member</td><td>Anna Example</td><td class="num">1 Feb 2021</td><td class="r">${chip(S.urOfficers)}</td></tr>
      </tbody></table></div>
      <span class="caveat">${icon("info", "icon icon-sm")}<span>Current roles only; past roles are not published. People appear only in this company's context.</span></span>${personDisclaimer()}`;
    else if (subj.key === "ee") body = `${purposeLine()}
      <div class="tbl-scroll"><table class="tbl"><thead><tr><th>Role</th><th>Name</th><th>Since</th><th class="r">Source</th></tr></thead><tbody>
        <tr><td>Management board member</td><td>Mari Näidis</td><td class="num">4 Jun 2019</td><td class="r">${chip(S.rik)}</td></tr>
      </tbody></table></div>
      <span class="caveat">${icon("info", "icon icon-sm")}<span>Current roles only; past roles are not published. People appear only in this company's context.</span></span>${personDisclaimer()}`;
    else if (subj.key === "lt" || subj.key === "sole-trader") body = `${purposeLine()}<div class="rows">
      ${R("Manager", { state: "data", value: "Has a manager since 21 Jan 2011", src: S.jar, conf: "official" })}
      ${R("Board", { state: "data", value: "No board", src: S.jar, conf: "official" })}
      ${R("Names", { state: "not_checked", reason: "paid_only", text: "Names are not in Lithuania's open data. Available as a paid register extract", orderUrl: true })}
      </div><span class="caveat">${icon("info", "icon icon-sm")}<span>Role facts only; names are not in Lithuania's open data.</span></span>`;
    else if (subj.key === "us-private") body = `<div class="rows">${R("Officers", { state: "not_published", text: "Not published by Colorado" })}</div>`;
    else body = secMissing ? `<div class="rows">${R("Officers and directors", { state: "not_checked", reason: "needs_key", text: "Set the SEC contact (user agent) to load filings" })}</div>`
      : `${purposeLine()}<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Role</th><th>Name</th><th>Since</th><th class="r">Source</th></tr></thead><tbody>
        <tr><td>Chief executive officer, director</td><td>Jordan Sample</td><td class="num">2016</td><td class="r">${chip(S.sec345)}</td></tr>
        <tr><td>Chief financial officer</td><td>Casey Example</td><td class="num">2021</td><td class="r">${chip(S.sec345)}</td></tr>
        <tr><td colspan="4"><button class="link-btn" type="button">Show all 9</button></td></tr>
      </tbody></table></div>
      <span class="caveat">${icon("info", "icon icon-sm")}<span>Current roles only; past roles are not published. People appear only in this company's context.</span></span>${personDisclaimer()}`;
    return section({ id: "people", sid: "S03", title: "People", body });
  }

  function ownersSection() {
    let rows = "";
    if (state === "loading") rows = R("Members", { state: "loading", w: 45 });
    else if (subj.key === "lv") rows = `
      ${R("Company members", { state: "data", html: `<a href="company.html?country=lv">Example Holding SIA</a> <span class="muted num">· 40000FX0099 · 60% since 2014</span>`, src: S.urMembers, conf: "official" })}
      ${R("Members who are private individuals", { state: "not_checked", reason: "restricted", country: "Latvia", basis: "legal rule 1 (court rulings on shareholder data)" })}
      ${R("Beneficial owners", { state: "not_checked", reason: "restricted", country: "Latvia", basis: "legal rule 1 (CJEU C-37/20)" })}`;
    else if (subj.key === "ee") rows = `
      ${R("Company members", { state: "not_published", text: "No company member on record" })}
      ${R("Members who are private individuals", { state: "not_checked", reason: "restricted", country: "Estonia", basis: "legal rule 1 (court rulings on shareholder data)" })}
      ${R("Beneficial owners", { state: "not_checked", reason: "restricted", country: "Estonia", basis: "legal rule 1 (CJEU C-37/20)" })}`;
    else if (subj.key === "lt" || subj.key === "sole-trader") rows = R("Owners", { state: "not_checked", reason: "paid_only", text: "Owner names are not in Lithuania's open data. Available as a paid register extract", orderUrl: true });
    else if (subj.key === "us-private") rows = R("Owners", { state: "not_published", text: "No US source publishes owners of private companies" });
    else rows = secMissing ? R("Large holders", { state: "not_checked", reason: "needs_key", text: "Set the SEC contact (user agent) to load filings" })
      : !purposeSet ? R("Large holders", { state: "not_checked", reason: "needs_purpose" }) + purposeGate()
      : `${R("Holders above 5% (13D/G)", { state: "data", value: "3 filers: 2 funds, 1 private individual", src: S.sec, conf: "official", caveat: "Large holders as filed with the SEC; people appear only in this company's context." })}`;
    const caveat = subj.key === "lv" || subj.key === "ee" ? `<span class="caveat">${icon("info", "icon icon-sm")}<span>Company members only; members who are private individuals are not shown (rule 1).</span></span>` : "";
    return section({ id: "owners", sid: "S04", title: "Owners", body: `<div class="rows">${rows}</div>${caveat}` });
  }

  function statusSection() {
    if (state === "loading") return section({ id: "status", sid: "S02", title: "Status and history", body: `<div class="rows">${R("Status", { state: "loading", w: 30 })}${R("History", { state: "loading", w: 70 })}</div>` });
    const snap = newInstall
      ? `<span class="partial-mark">4 days of history, tracked since 16 Nov 2026</span>`
      : `<span class="state-line checked">${icon("check", "icon icon-sm")}<span>No address or legal-form change since tracking started</span></span>`;
    const events = {
      lv: [["3 Sep 2026", `Renamed from <em>Paraugs Wood SIA</em>`, S.urNames, "point"], ["12 Mar 2014", "Registered in the commercial register", S.urLV]],
      ee: [["4 Jun 2019", "Entered in the register", S.rik]],
      lt: [["21 Jan 2011", "Registered", S.jar]],
      "sole-trader": [["15 May 2017", "Registered", S.jar]],
      "us-private": [["2 Jul 2026", "Periodic report filed", S.coSos], ["8 Jul 2019", "Articles of organization filed", S.coSos]],
      "us-public": [["6 Nov 2026", "10-Q filed", S.sec], ["14 Feb 2026", "Officer change (8-K item 5.02)", S.sec, "point"]],
    }[subj.key];
    const body = `<div class="events">
      ${events.map(([d, t, s, f]) => `<div class="event"><span class="event-date num">${d}</span><span class="event-body"><span>${t} ${f ? sev("point_to_check") : ""}</span><span>${chip(s)}</span></span></div>`).join("")}
      </div>
      <div class="rows" style="margin-top:8px">
        ${R("Changes in the last 6 months", { state: "data", html: snap, partial: newInstall ? "Too short for the 6-month rename rule, so check 2 reads “not evaluated” until the history covers it." : "" })}
      </div>
      <span class="caveat">${icon("clock", "icon icon-sm")}<span>Address and legal-form history: tracked by Finora since 16 Nov 2026${subj.key === "lv" ? ". Name history comes from the register (last updated 2 Apr 2025)." : "."}</span></span>`;
    return section({ id: "status", sid: "S02", title: "Status and history", body });
  }

  function financialsSection() {
    if (state === "loading") return section({ id: "financials", sid: "S06", title: "Financials", body: `<div class="rows">${R("Revenue", { state: "loading", w: 80 })}${R("Profit", { state: "loading", w: 70 })}${R("Equity", { state: "loading", w: 75 })}</div>` });
    if (subj.key === "us-private") return section({ id: "financials", sid: "S06", title: "Financials", body: `<div class="collapsed-line">${icon("dash", "icon icon-sm")}No US source publishes accounts of private companies.</div>` });
    if (secMissing) return section({ id: "financials", sid: "S06", title: "Financials", body: `<div class="rows">${R("Key figures", { state: "not_checked", reason: "needs_key", text: "Set the SEC contact (user agent) to load XBRL financials" })}</div>` });
    if (natural && !purposeSet) return section({ id: "financials", sid: "S06", title: "Financials", body: `<div class="rows">${R("Key figures", { state: "not_checked", reason: "needs_purpose" })}</div><span class="caveat">${icon("info", "icon icon-sm")}<span>A sole trader's business figures are shown after a stated purpose, as facts only, and never feed a verdict.</span></span>` });
    const cur = subj.cc === "US" ? "USD m" : "EUR k";
    const years = subj.cc === "US" ? ["FY to Sep 2025", "FY to Sep 2024", "FY to Sep 2023", "FY to Sep 2022", "FY to Sep 2021"] : ["2025", "2024", "2023", "2022", "2021"];
    const data = {
      lv: { Revenue: [2410, 2185, 1960, null, 1720], "Net result": [142, 118, 96, null, 61], Equity: [905, 763, 645, null, 549], "Total assets": [1830, 1702, 1544, null, 1310], Employees: [18, 17, 16, null, 14] },
      ee: { Revenue: [1260, 1310, 1105, 980, 870], "Net result": [-12, 34, 41, 22, 18], Equity: [214, 226, 192, 151, 129], "Total assets": [690, 712, 655, 588, 501], Employees: [11, 12, 10, 9, 9] },
      lt: { Revenue: [3120, 2980, 2740, 2510, 2260], "Net result": [88, 102, 91, 74, 66], Equity: [640, 552, 450, 359, 285], "Total assets": [1410, 1355, 1220, 1104, 990], Employees: [null, null, null, null, null] },
      "sole-trader": { Revenue: [96, 88, 81, 74, 70], "Net result": [21, 19, 17, 15, 14], Equity: [null, null, null, null, null], "Total assets": [null, null, null, null, null], Employees: [null, null, null, null, null] },
      "us-public": { Revenue: [842, 801, 776, 712, 655], "Net income": [61, 58, 49, 41, 37], Equity: [512, 468, 433, 401, 377], "Total assets": [1220, 1170, 1102, 1050, 990], Employees: [2140, 2080, 2010, 1950, 1870] },
    }[subj.key];
    const fmt = (v) => (v == null ? `<span class="muted">—</span>` : v.toLocaleString("en-US"));
    const rows = Object.entries(data).map(([k, vals]) => {
      if (vals.every((v) => v == null)) return "";
      const d = vals[0] != null && vals[1] != null ? vals[0] - vals[1] : null;
      const delta = d == null ? "" : `<span class="${d >= 0 ? "delta-up" : "delta-down"} small num">${icon(d >= 0 ? "arrowUp" : "arrowDown", "icon icon-sm")}${d >= 0 ? "+" : "−"}${Math.abs(Math.round((d / Math.abs(vals[1])) * 100))}%</span>`;
      return `<tr><th scope="row" style="font-weight:400;color:var(--ink-2)">${k}</th>${vals.map((v) => `<td class="r num">${fmt(v)}</td>`).join("")}<td class="r">${sparkline([...vals].reverse())}</td><td class="r">${delta}</td></tr>`;
    }).join("");
    const gap = subj.key === "lv" ? `<span class="caveat">${icon("info", "icon icon-sm")}<span class="partial-mark">2022 not filed</span><span>· the column is empty, not zero.</span></span>` : "";
    const srcChip = { lv: S.fsLV, ee: S.rikFs, lt: S.jarFs, "sole-trader": S.jarFs, "us-public": S.secFacts }[subj.key];
    const body = `${natural ? purposeLine() : ""}<div class="tbl-scroll"><table class="tbl"><caption class="sr-only">Key figures by year, ${cur}</caption><thead><tr><th>${cur}</th>${years.map((y) => `<th class="r">${y}</th>`).join("")}<th class="r">5 years</th><th class="r">Last year</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px">${gap}<span style="margin-left:auto;display:flex;gap:8px;align-items:center">${conf("official")}${chip(srcChip)}</span></div>`;
    return section({ id: "financials", sid: "S06", title: "Financials", body, end: `<button class="link-btn" type="button">All line items</button>` });
  }

  function workforceSection() {
    if (state === "loading") return "";
    let rows;
    if (subj.key === "lv") rows = R("Employees", { state: "data", html: `<span class="num">18</span> <span class="muted">· 30 Sep 2026</span> ${sparkline([14, 15, 15, 16, 16, 17, 17, 18], 96, 20)}`, src: S.vid, conf: "official", caveat: "Employees from tax filings, quarterly; covers 54-58% of active companies." });
    else if (subj.key === "ee") rows = R("Employees", { state: "data", value: "No employee count from the tax board for Q3 2026", src: S.emtaTax, conf: "official", caveat: "Quarterly, from the tax board (CC BY-SA); board members are not counted." });
    else if (subj.key === "lt") rows = phase === "report"
      ? R("Insured employees", { state: "data", value: "27 on 20 Nov 2026", src: S.sodra, conf: "official", caveat: "Read live from Sodra by the money and tax agent and never stored, while the licence question is open." })
      : R("Social-insurance data", { state: "not_checked", reason: "agent_only", agent: "money and tax" });
    else if (subj.key === "us-public") rows = secMissing ? R("Employees", { state: "not_checked", reason: "needs_key", text: "Set the SEC contact (user agent)" }) : R("Employees", { state: "data", value: "2,140 (FY 2025)", src: S.secFacts, conf: "official", caveat: "From the annual report (self-reported)." });
    else return "";
    return section({ id: "workforce", sid: "S07", title: "Workforce", body: `<div class="rows">${rows}</div>` });
  }

  function taxSection() {
    if (state === "loading") return "";
    if (natural) return section({ id: "tax", sid: "S08", title: "Taxes and arrears", body: `<div class="rows">${["Tax arrears", "Social-insurance debt", "Taxes paid"].map((l) => R(l, { state: "not_checked", reason: "restricted", text: "Not shown for a sole trader: restricted by legal rule 5" })).join("")}</div><span class="caveat">${icon("info", "icon icon-sm")}<span>The same for every sole trader: Finora doesn't load these lines for a private individual, so their absence says nothing about the person.</span></span>` });
    if (subj.cc === "US") return section({ id: "tax", sid: "S08", title: "Taxes and arrears", body: `<div class="collapsed-line">${icon("dash", "icon icon-sm")}The US publishes no tax payment or tax debt data.</div>` });
    let rows;
    if (subj.key === "lv") rows = `

  /* ---------- Checks card (profile) and verdict (report) ---------- */
  const CHECK_IC = { stale: ["", "clock", "Data older than its usual cycle"], noteval: ["notrun", "clock", "Not evaluated yet"], ok: ["", "check", "None found or on record"], soft: ["flag-soft", "bang", "Point to check"], hard: ["flag-hard", "x", "Concern"], notrun: ["notrun", "dash", "Not run"], pending: ["notrun", "agent", "Runs when you investigate"] };
  function checksList(checks, opts = {}) {
    return `<div class="checks" role="list">${checks.map(([t, s, why], i) => {
      let st = s;
      const pendingRow = opts.instant && i >= 9 && s !== "notrun";
      if (pendingRow) st = "pending";
      const [cls, ic, lbl] = CHECK_IC[st];
      return `<div class="check" role="listitem" ${opts.ids ? `id="check-${i + 1}"` : ""}><span class="check-ic ${cls}" title="${lbl}">${icon(ic, "", lbl)}</span><span class="check-body"><span class="check-title">${i + 1}. ${esc(t)}</span><span class="check-why">${pendingRow ? (i === 10 ? "Runs when you investigate, if a website is known" : "Runs when you investigate") : esc(why)}</span></span></div>`;
    }).join("")}</div>`;
  }

  function verdictChecks() {
    const c = subj.checks.map((x) => [...x]);
    if (level === "none") c.forEach((x) => { if (x[1] === "soft") { x[1] = "ok"; x[2] = "None found"; } });
    if (level === "serious") { c[7] = [c[7][0], "hard", "Insolvency proceedings started 14 Nov 2026"]; }
    if (state === "partial") c[10] = [c[10][0], "notrun", "Web agent did not finish (the website did not answer)"];
    if (stopped) c[10] = [c[10][0], "notrun", "Stopped by you before the web agent finished"];
    if (offer === "mismatch") c[10] = [c[10][0], "soft", "paraugs-timber-pay.example is not linked to Paraugs Timber SIA in the register or on its own website"];
    if (offer === "other") c[10] = [c[10][0], "soft", "paraugs-timber-pay.example belongs to another company: its homepage states registration no. 40000FX0093", "first"];
    if (offer === "unresolvable") c[10] = [c[10][0], "soft", "paraugs-timber-pay.example does not resolve"];
    return c;
  }

  function verdictBlock() {
    if (natural) {
      return `<div class="facts-only" role="region" aria-label="Facts only">
        <span class="label">Facts only</span>
        <p class="serif" style="font-size:30px;line-height:36px">No verdict is given on a private individual.</p>
        <p class="small muted">Finora lists the official facts and their sources, never rates a person and runs no agents on one.</p>
        <span class="coverage-line">official facts from 3 sources · 19 Nov 2026</span>
      </div>`;
    }
    const checks = verdictChecks();
    const ran = checks.filter((c) => c[1] !== "notrun").length;
    const notPossible = checks.filter((c) => c[1] === "notrun").length;
    const L = {
      none: ["No concerns found", "dot", "lvl-none"],
      points: ["Points to check", "bang", "lvl-points"],
      serious: ["Serious concerns", "x", "lvl-serious"],
      insufficient: ["Not enough data", "q", "lvl-insufficient"],
    }[level];
    const fired = checks.map((c, i) => [c, i]).filter(([c]) => c[1] === "soft" || c[1] === "hard");
    const why = level === "insufficient"
      ? [ran < 6 ? `Only ${ran} of 11 checks ran; the rule needs at least 6.` : "", checks[5][1] === "notrun" && checks[6][1] === "notrun" ? "Neither money check ran (6, financial position; 7, tax and social-insurance arrears)." : "", !checks[0] || checks[0][1] === "notrun" ? "The company is not pinned to a registry record." : ""].filter(Boolean).map((t) => `<div class="why-item">${icon("dash", "icon icon-sm")}<span>${t} Any flag would still show here.</span></div>`).join("")
      : fired.length ? fired.map(([c, i]) => `<div class="why-item">${icon(c[1] === "hard" ? "x" : "bang", "icon icon-sm")}<span><a href="#check-${i + 1}">Check ${i + 1}</a>: ${esc(c[2])} <span class="muted">(${c[1] === "hard" ? "hard flag" : "soft flag"})</span></span></div>`).join("")
      : `<div class="why-item">${icon("dash", "icon icon-sm")}<span>No hard or soft flag in the checks that ran.</span></div>`;
    const explain = {
      lv: "The company is active, its annual reports are in the register and it has grown revenue for three years. Two things are worth a look before you pay a deposit: it changed its name in September, and an open securing measure since October stops it from registering changes. Ask what the measure relates to and whether it is close to being lifted.",
      ee: "The company is registered, its 2025 annual report is in the register and it is not on the tax debtor list. It made a small loss in 2025, and a commercial pledge registered in 2024 means a lender holds security over its assets.",
      lt: "The company is active and profitable, but it is on the tax arrears list for €3,420 since September. Ask whether a payment plan is in place.",
      "us-private": "The company is registered and in good standing in Colorado, with no UCC filings, exclusions or sanctions hits. US public sources don't publish its owners, accounts or taxes.",
      "us-public": "The company's annual filings are in and it is profitable. A federal civil case names a party with the same name, but the record has no identifier, so it is listed as a fact, not a finding about this company.",
    }[subj.key];
    return `<section class="verdict ${L[2]}" aria-labelledby="verdict-h">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="label">Verdict</span>${ruleTag()}</div>
      <h2 class="verdict-level" id="verdict-h"><span class="lvl-ic">${icon(L[1], "", L[0])}</span>${L[0]}</h2>
      <p class="coverage-line num">${ran} of 11 checks ran${notPossible ? ` · ${notPossible} not possible in ${esc(subj.country === "the United States" ? "the US" : subj.country)}` : ""} · 38 sources · 20 Nov 2026</p>
      <p class="small ink2">Added by this investigation: ${subj.cc === "US" ? "3" : "4"} findings from live sources (${subj.cc === "US" ? "federal courts, the website, news" : "the UN list, the central bank's warnings, the website, news"}). ${ruleTag()}</p>
      <div class="why"><span class="label">Why this level</span>${why}</div>
      <div class="explain"><div style="display:flex;gap:8px;align-items:center">${aiTag()}<span class="small muted">Written from the findings below; every sentence links to its evidence.</span></div><p>${esc(explain)}</p></div>
      <div class="keyf"><span style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="label">Key findings</span>${ruleTag()}<span class="small muted">concerns first, then points to check, by check number</span></span>
        ${keyFindings(checks).length ? keyFindings(checks).map((k, i) => `<div class="keyf-item"><span class="keyf-n">0${i + 1}</span><span style="display:flex;flex-direction:column;gap:4px"><span>${k.hard ? sev("concern") : sev("point_to_check")} Check ${k.n}: ${esc(k.text)}</span><a class="small" href="#${k.anchor}">See the evidence</a></span></div>`).join("")
          : `<p class="small muted" style="padding-top:8px">No check raised a point or a concern, so there are no key findings.</p>`}
      </div>
    </section>
    <section class="section" aria-labelledby="checks-h"><div class="section-head"><h2 id="checks-h">The 11 checks</h2><span class="sid">S18</span></div>${checksList(checks, { ids: true })}</section>`;
  }
  // Council item 10: key findings are the fired checks only, concerns first, then points to check, then by
  // check number; never inferred, name-only or context findings; fewer than three when fewer qualify.
  function keyFindings(checks) {
    const ANCHOR = ["status", "status", "people", "owners", "filings", "financials", "tax", "insolvency", "sanctions", "courts", "web"];
    return checks.map((c, i) => ({ n: i + 1, text: c[2], hard: c[1] === "hard", first: c[3] === "first", fired: c[1] === "hard" || c[1] === "soft", anchor: ANCHOR[i] }))
      .filter((k) => k.fired)
      .sort((a, b) => (b.hard - a.hard) || (b.first - a.first) || a.n - b.n)
      .slice(0, 3);
  }

  /* ---------- Aside: checks card, agent panel, chat ---------- */
  function lanes() {
    const L = [
      { n: "Lead: resolve and plan", st: "done", meta: "14 s · 1% of the cap", step: "Pinned to registration no. 40000FX0017" },
      { n: "Registry and people", st: "done", meta: "22 s · 3% of the cap", tasks: [["done", "register file", "1"], ["done", "officers", "1"], ["done", "company members", "1"], ["done", "name history", "1"], ["done", "our snapshots", "1"]] },
      { n: "Money and tax", st: "done", meta: "28 s · 4% of the cap", tasks: [["done", "annual reports", "1"], ["done", "quarterly taxes", "1"], ["done", "tax rating", "1"], ["skipped", "tax debt amount: manual lookup only", "0"]] },
      { n: "Legal, insolvency and sanctions", st: q === "sanctions" && state === "question" ? "waiting" : state === "partial" ? "done" : "running", meta: "31 s · usually under 1 min · 4% of the cap", tasks: [["done", "insolvency register", "1"], ["done", "securing measures", "1"], ["done", "EU consolidated list", "1"], ["done", "OFAC lists", "1"], ["done", "UK Sanctions List", "1"], ["done", "FIU frozen-assets list", "1"], ["running", "UN list (live)", "0"], ["skipped", "court portals: manual in the Baltics", "0"], ["queued", "central bank warnings", "0"]] },
      { n: "Web, domain and news", st: state === "partial" ? "failed" : "running", meta: "48 s · usually 1-2 min · 6% of the cap", step: state === "partial" ? "stopped: the website did not answer" : "checking news in dataset P4", tasks: [["done", "domain from the register", "1"], ["done", "DNS", "1"], ["done", "certificate logs", "1"], [state === "partial" ? "failed" : "done", "homepage, through Finora's page filter", "1"], ["running", "news, dataset P4", "2"]] },
      { n: "Verdict", st: "queued", meta: "usually 15-30 s", step: "" },
    ];
    if (state === "question" && q === "entity") L.forEach((l, i) => { if (i === 0) { l.st = "waiting"; l.step = "waiting for you: which company is it?"; l.meta = "12 s · 1% of the cap"; } else { l.st = "queued"; l.tasks = undefined; l.step = ""; l.meta = "waits for the lead"; } });
    if (reconnecting) L.forEach((l) => { if (l.st === "running") l.meta = l.meta + " · last update 12 s ago"; });
    if (limited) L.forEach((l) => { if (l.st === "running") { l.st = "waiting"; l.step = "paused: your Claude plan's usage limit, resumes after 14:00"; } });
    if (overage) L.forEach((l) => { if (l.st === "running") { l.st = "waiting"; l.step = "paused: paid extra usage is in use"; } });
    if (param("lane", "") === "busy" && state === "streaming") { const g = L[3]; g.st = "waiting"; g.label = "waiting: Claude is busy"; g.step = "Claude Code is retrying a short burst; this is not a pause"; }
    if (concurrency2 && state === "streaming") { const w = L[4]; w.st = "queued"; w.label = "waiting to start"; w.step = "starts when a lane finishes (2 agents at a time on this plan)"; w.meta = "0 s"; w.tasks = w.tasks.map((t) => ["queued", t[1], "0"]); }
    if (stopped) L.forEach((l) => { if (l.st === "running" || l.st === "queued") { l.st = l.n === "Verdict" ? "done" : "stopped"; l.step = l.n === "Verdict" ? "written from the findings so far" : "stopped by you at 09:44:05"; } });
    if (state === "question" && (q === "cap" || q === "cap-used")) L.forEach((l) => { if (l.st === "running") { l.st = "waiting"; l.step = "paused at the usage cap"; } });
    const TI = { done: "check", running: null, queued: "clock", failed: "x", skipped: "skip" };
    const lane = (l) => `<div class="lane ${l.st}">
      <div class="lane-head"><span class="status ${l.st}"><span class="dot"></span>${l.label || l.st}</span><span class="lane-name">${esc(l.n)}</span></div>
      <span class="lane-meta num" style="margin-left:0">${esc(l.meta)}</span>
      ${l.step ? `<span class="lane-step">${esc(l.step)}</span>` : ""}
      ${l.st === "failed" ? `<span><button class="btn btn-sm" type="button">Retry this agent</button></span>` : ""}
      ${l.tasks ? `<div class="tasks">${l.tasks.map(([s, t, n]) => `<div class="task ${s}"><span class="t-ic">${TI[s] ? icon(TI[s], "icon icon-sm") : '<span class="spinner"></span>'}</span><span class="t-label">${esc(t)}</span><span class="t-end num">${s === "queued" ? "queued" : s === "skipped" ? "skipped" : `${n} src`}</span></div>`).join("")}</div>` : ""}
    </div>`;
    return `<section class="card" id="agents" tabindex="-1" style="padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:120px" aria-label="Agents">
      <div style="display:flex;align-items:baseline;gap:8px"><h2 class="serif" style="font-size:22px">Agents</h2><span class="muted small num" style="margin-left:auto">18% of the cap</span></div>
      <div class="meter ${q.startsWith("cap") && state === "question" ? "cap" : ""}" role="progressbar" aria-label="Spend against the cap" aria-valuenow="${q.startsWith("cap") && state === "question" ? 100 : 18}" aria-valuemin="0" aria-valuemax="100"><i style="width:${q.startsWith("cap") && state === "question" ? 100 : 18}%"></i></div>
      <div class="lanes">${L.map(lane).join("")}</div>
      <p class="small muted">Lanes run in parallel. Findings land in their section as each check finishes.</p>
    </section>`;
  }

  function checksCard() {
    if (natural) return `<section class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><h2 class="serif" style="font-size:22px">Facts only</h2><p class="small muted">No checks are scored and no agents run for a sole trader, because a sole trader is a private individual (legal rule 5). The page lists the official facts with their sources.</p></section>`;
    if (state === "loading") return `<section class="card" style="padding:16px"><span class="sk" style="width:50%;height:18px"></span><div style="height:12px"></div>${Array.from({ length: 6 }, () => '<span class="sk" style="margin:10px 0"></span>').join("")}</section>`;
    return `<section class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px" aria-labelledby="ic-h">

    if (q === "scope") return card("Web, domain and news agent", "Is paraugs-timber.example this company's website?",

    }
    const top = phase === "report" || (natural && state === "full") ? verdictBlock() : "";
    const t = subj.checks || [];
    const tally = phase === "profile" && !natural && state === "full" ? `<div class="checks-tally" role="note"><span><strong>No verdict yet.</strong> Official checks: ${t.filter((c, i) => i < 9 && c[1] === "ok").length} on record · ${t.filter((c) => c[1] === "soft" || c[1] === "hard").length} to check · ${t.filter((c) => c[1] === "notrun").length} not possible · ${t.filter((c) => c[1] === "stale").length} past their cycle</span><a href="#ic-h">See the checks</a></div>` : "";
    const banner = state === "unsafe" ? `<div class="banner banner-bad" role="alert">${icon("warn")}<span><strong>Stopped for safety before any agent ran.</strong> Claude Code on this machine didn't start in Finora's locked-down mode: it reported tools or settings Finora doesn't allow. Nothing ran and no finding was written. <a href="settings.html">Check the connection</a> · <button class="link-btn" type="button">Try again</button></span></div>` : stopped ? `<div class="banner banner-info" role="status">${icon("stop")}<span><strong>You stopped this investigation at 09:44:05.</strong> Findings so far are kept, the verdict is written from them, and checks that had not finished count as not run. <a href="?${qs({ state: "streaming", stopped: "no" })}">Re-run</a></span></div>` : state === "partial" ? `<div class="banner banner-warn" role="status">${icon("warn")}<span><strong>One agent did not finish.</strong> The web agent stopped when the company's website did not answer, so check 11 counts as not run. Other findings are complete. <button class="link-btn" type="button">Re-run the web agent</button></span></div>` : "";
    const lanesInline = phase === "run" && !(state === "question" && q === "entity") ? `<section class="lanes-inline" aria-label="Agents, compact">
      ${[["done", "Registry and people", "5 of 5 tasks", "22 s · 3%"], ["done", "Money and tax", "3 of 4 tasks, 1 skipped", "28 s · 4%"], [q === "sanctions" && state === "question" ? "waiting" : "running", "Legal, insolvency and sanctions", q === "sanctions" && state === "question" ? "waiting for you: possible sanctions match" : "checking the UN list", "31 s · 4%"], ["running", "Web, domain and news", "checking news in dataset P4", "48 s · 6%"], ["queued", "Verdict", "waits for the four agents", ""]].map(([st, n, step, meta]) => `<div class="li-row"><span class="status ${st}"><span class="dot"></span>${st}</span><span class="li-name">${n}</span><span class="li-meta num">${meta}</span><span class="li-step">${st === "done" ? "✓ " : "› "}${step}</span></div>`).join("")}
      <a class="small" href="#agents" style="min-height:32px;display:inline-flex;align-items:center" onclick="setTimeout(() => document.getElementById('agents').focus(), 0)">All tasks and sources</a></section>` : "";
    const runBar = phase === "run" ? `<div class="run-bar" role="status"><span>${reconnecting ? "Reconnecting" : limited ? "Paused until 14:00" : overage ? "Paused: paid extra usage" : state === "question" ? "Needs you" : "4 agents · 2 running"} · 18% of the cap</span><a href="#agents" onclick="setTimeout(() => document.getElementById('agents').focus(), 0)">Show agents</a></div>` : "";
    const limitCard = limited ? `<section class="question" id="question" aria-labelledby="lim-h" role="region">
      <div class="q-who"><span class="status waiting"><span class="dot"></span>Paused</span><span class="small ink2">Your Claude plan</span>${ruleTag()}</div>
      <h2 id="lim-h">Usage limit reached: resumes after 14:00</h2>
      <p class="small muted">Claude reports your 5-hour window at 100%, resetting at 14:00.</p>
      <p class="small ink2">Your Claude plan's usage window ran out at 09:44, so the agents stopped mid-run. Nothing is lost: findings so far are kept, and no verdict is written on partial evidence.</p>
      <div class="q-options">
        <button class="q-option default" type="button"><span class="q-title">Resume at 14:00</span><span class="q-sub">The run picks up where it stopped · default</span></button>
        <button class="q-option" type="button"><span class="q-title">Stop here and write the report</span><span class="q-sub">Checks that haven't finished count as not run</span></button>
      </div>
      <div class="q-foot"><span>${icon("clock", "icon icon-sm")} Waiting: Legal, insolvency and sanctions; Web, domain and news; the verdict</span></div>
    </section>` : "";
    const overageCard = overage ? `<section class="question" id="question" aria-labelledby="ov-h" role="region">
      <div class="q-who"><span class="status waiting"><span class="dot"></span>Paused</span><span class="small ink2">Your Claude account</span>${ruleTag()}</div>
      <h2 id="ov-h">Paid extra usage is on in your Claude account. Turn it off to continue.</h2>
      <p class="small ink2">${param("why", "inuse") === "limit" ? "Your 5-hour window is used up and paid extra usage is permitted, so the next request would have been paid. Finora stopped every agent before it: Finora never costs money." : "A run started drawing on paid extra usage at 09:44, so Finora stopped every agent at once: Finora never costs money."} Findings so far are kept, and no verdict is written on partial evidence.</p>
      <div class="q-options">
        <button class="q-option default" type="button"><span class="q-title">Check and resume</span><span class="q-sub">Resumes only when Claude reports paid extra usage off, or a window reset. A pause never ends by itself</span></button>
        <button class="q-option" type="button"><span class="q-title">Stop here and write the report</span><span class="q-sub">Checks that haven't finished count as not run</span></button>
      </div>
    </section>` : "";
    const qcard = overage ? overageCard : limited ? limitCard : state === "question" ? questionCard() : reconnecting ? `<div class="banner banner-warn" role="status">${icon("warn")}<span><strong>Connection lost at 09:43:12. Reconnecting (attempt 2)…</strong> The run keeps going on this machine; when the page reconnects it catches up from the last event it saw. Nothing is lost. <button class="link-btn" type="button">Retry now</button></span></div>` : "";
    const sections = [statusSection(), peopleSection(), ownersSection(), financialsSection(), workforceSection(), taxSection(), insolvencySection(), courtsSection(), sanctionsSection(), filingsSection(), securitiesSection(), webSection(), networkSection()].join("");
    const index = phase !== "run" && state !== "loading" ? `<nav class="sec-index" aria-label="Sections">${[["status", "Status"], ["people", "People"], ["owners", "Owners"], ["financials", "Financials"], ["tax", "Taxes"], ["insolvency", "Insolvency"], ["courts", "Courts"], ["sanctions", "Sanctions"], ["web", "Web"]].filter(([a]) => sections.includes(`id="${a}"`)).map(([a, l]) => `<a href="#${a}">${l}</a>`).join("")}</nav>` : "";
    const aside = phase === "run" ? lanes() : phase === "report" ? chatDock() + (state === "partial" || stopped ? lanes() : "") : checksCard();
    const footer = `<footer class="small muted" style="padding-top:12px;display:flex;flex-direction:column;gap:4px">
      <span>Sources: ${subj.cc === "LV" ? "Register of Enterprises of the Republic of Latvia; State Revenue Service (CC0 1.0)" : subj.cc === "EE" ? "e-Business Register (CC BY 4.0); Tax and Customs Board (CC BY-SA 3.0, kept in its own store and left out of exports)" : subj.cc === "LT" ? (natural ? "Registrų centras, Register of Legal Entities (open data), CC BY 4.0" : "Registrų centras, Register of Legal Entities (open data), CC BY 4.0; State Tax Inspectorate (VMI), CC BY 4.0; Sodra, public insurer data") : "SEC EDGAR and state registers (US government works)"}. © European Union (EU sanctions list). Contains public sector information licensed under the Open Government Licence v3.0 (UK list).</span>
      <span>${natural ? "Not a credit report. Not for credit, employment, tenancy or insurance decisions. " : ""}AI-written text is labelled. <a href="#">Report an error or object</a></span>
    </footer>`;
    return `<div class="page"><div class="cols">
      <div class="primary">${header()}${tally}${runBar}${banner}${qcard}${lanesInline}${top}${index}${sections}${footer}</div>
      <aside class="aside" tabindex="0" aria-label="${phase === "run" ? "Agents" : phase === "report" ? "Follow-up questions" : "Checks"}">${aside}</aside>
    </div></div>${sheetFor()}`;
  }

  Finora.mount("explorer", render, [
    { key: "country", label: "Subject", options: [["lv", "Latvia · SIA (full)"], ["ee", "Estonia · OÜ"], ["lt", "Lithuania · UAB"], ["us-private", "US private · Colorado LLC"], ["us-public", "US public · SEC filer"], ["sole-trader", "Sole trader · facts only (LT)"]] },
    { key: "state", label: "Page state", options: [["full", "Profile: official data"], ["loading", "Profile: loading"], ["error", "Profile: error"], ["estimate", "Investigate: usage estimate sheet"], ["agents-off", "Investigate: agents not turned on"], ["busy", "Investigate: another investigation running"], ["unsafe", "Investigation stopped for safety at start"], ["first-run", "Investigate: first-time extra-usage notice"], ["cli-missing", "Investigate: Claude Code not installed"], ["cli-signed-out", "Investigate: Claude Code not signed in"], ["daily-cap", "Investigate: daily usage cap reached"], ["streaming", "Investigation streaming"], ["reconnecting", "Investigation: reconnecting"], ["limit", "Investigation: plan usage limit, paused"], ["overage", "Investigation: paid extra usage in use, paused"], ["question", "Agent asks you"], ["report", "Report"], ["partial", "Report: one agent failed"]] },
    { key: "q", label: "Question (with Agent asks you)", options: [["entity", "Which company is it?"], ["sanctions", "Possible sanctions match"], ["scope", "Is this website theirs?"], ["cap", "Cost cap reached"], ["cap-used", "Cap reached, extension used"]] },
    { key: "verdict", label: "Verdict level (with Report)", options: [["auto", "As the data says"], ["none", "No concerns found"], ["points", "Points to check"], ["serious", "Serious concerns"], ["insufficient", "Not enough data"]] },
    { key: "purpose", label: "Purpose gate", options: [["set", "Purpose stated"], ["unset", "No purpose yet"]] },
    { key: "install", label: "Snapshot history", options: [["established", "Covers 6 months"], ["new", "New install: not evaluated yet"]] },
    { key: "sec", label: "SEC contact (US public)", options: [["set", "Set"], ["missing", "Missing: needs key"]] },
    { key: "name", label: "Name length", options: [["normal", "Normal"], ["long", "Very long (Latvia)"]] },
    { key: "overage", label: "Paid extra usage (estimate, run)", options: [["off", "Off"], ["enabled", "On but not in use: warning"]] },
    { key: "window", label: "Claude's own plan-window figure (estimate)", options: [["", "Not reported or under 90%"], ["high", "Reported at 92%: warning"]] },
    { key: "why", label: "Overage pause trigger", options: [["inuse", "Paid usage in use"], ["limit", "Permitted and the window used up"]] },
    { key: "lane", label: "Lane state (streaming)", options: [["", "Normal"], ["busy", "One lane: Waiting, Claude is busy"]] },
    { key: "concurrency", label: "Parallel agents (streaming)", options: [["4", "4 at a time"], ["2", "2 at a time: one waiting to start"]] },
    { key: "offer", label: "Offer domain (report, Latvia)", options: [["none", "Not given"], ["match", "Tied to the company"], ["mismatch", "Not tied to the company"], ["other", "Belongs to another company"], ["unresolvable", "Does not resolve"]] },
    { key: "lvpeople", label: "Latvian officer names", options: [["names", "Names (v1 default)"], ["role_counts", "Role counts only (legal fallback)"]] },
  ]);
})();
</script>
</body>
</html>
